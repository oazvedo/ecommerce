version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=api_db;Username=postgres;Password=postgres"
      JwtSettings__Issuer: "api-dev"
      JwtSettings__Audience: "api-dev"
      JwtSettings__Secret: "dev-secret-key-change-in-production-min32chars"
    ports:
      - "5103:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
